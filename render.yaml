databases:
  - name: waste-collection-db
    plan: free

services:
  - type: web
    name: waste-collection
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn waste_collection.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: waste-collection-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"
